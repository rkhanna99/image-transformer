version: "3.9"

services:
  image-transformer:
    image: image-transformer
    build: .
    container_name: image_transformer
    ports:
      - "55000:5000" # Map host port 55000 to container 5000 for local/dev access
    volumes:
      - .:/app
      - ./static/uploads:/app/static/uploads # Mounting the uploads directory to persist uploaded files directly
    environment:
      - DEV=1
      - FLASK_DEBUG=1
    restart: unless-stopped
  