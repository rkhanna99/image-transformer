services:
  image-transformer:
    image: image-transformer:dev
    build: .
    command: ["python", "app.py"]
    container_name: image_transformer
    ports:
      - "55000:5000"
    volumes:
      - .:/app
    environment:
      DEV: "0"
      FLASK_DEBUG: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
