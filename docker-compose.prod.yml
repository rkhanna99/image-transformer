services:
  image-transformer:
    image: image-transformer:latest
    build: .
    ports:
      - "5000:5000"
    environment:
      DEV: "0"
    volumes:
      - toolkit_jobs:/app/data/jobs
      - toolkit_uploads:/app/static/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  toolkit_jobs:
  toolkit_uploads:
